{{define "content"}}
<h2>Редактировать трату</h2>
{{if .Error}}<p>{{.Error}}</p>{{end}}
<form method="POST" action="/expenses/edit?id={{.Expense.ID}}">
    <label for="amount">Сумма</label>
    <input id="amount" type="text" inputmode="decimal" name="amount" value="{{.FormAmount}}" required>

    <label for="description">Описание</label>
    <input id="description" type="text" name="description" value="{{.FormDescription}}" required>

    <label for="date">Дата</label>
    <input id="date" type="text" placeholder="ГГГГ-ММ-ДД" name="date" value="{{.FormDate}}" required>

    <label for="category">Категория</label>
    <select id="category" name="category" required>
        {{if .InvalidCategory}}
        <option value="{{.FormCategory}}" selected>Неверная категория ({{.FormCategory}})</option>
        {{end}}
        {{range .Categories}}
        <option value="{{.ID}}" {{if eq (printf "%d" .ID) $.FormCategory}}selected{{end}}>{{.Name}}</option>
        {{end}}
    </select>

    <button type="submit">Сохранить</button>
</form>
{{end}}
