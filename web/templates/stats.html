{{define "content"}}
<h2>Статистика</h2>
<form method="GET" action="/stats">
    <h3>Период для категорий</h3>
    <label for="from">От</label>
    <input id="from" type="date" name="from" value="{{.From}}">
    <label for="to">До</label>
    <input id="to" type="date" name="to" value="{{.To}}">
    <h3>Год для статистики по месяцам</h3>
    <label for="year">Год</label>
    <input id="year" type="number" name="year" min="1" max="9999" value="{{.Year}}" required>
    <button type="submit">Показать</button>
</form>
<p id="stats-error"></p>
<h3>Траты по категориям</h3>
<p id="category-empty"></p>
<div class="chart">
    <canvas id="category-chart"></canvas>
</div>
<h3>Траты по месяцам</h3>
<p id="month-empty"></p>
<div class="chart">
    <canvas id="month-chart"></canvas>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
<script src="/static/stats.js"></script>
{{end}}
